name: Arcade UI CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler:
    name: AOT compiler and diagnostics
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install compiler dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile example UI
        run: |
          mkdir -p dist
          python tools/arcuxc.py examples/dashboard.html -o dist/dashboard.arcuxi
          test -s dist/dashboard.arcuxi
      - uses: actions/upload-artifact@v4
        with:
          name: arcuxi-example
          path: dist/dashboard.arcuxi
          if-no-files-found: error

  source-package:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/arcade-ui-source.zip HEAD
          sha256sum dist/arcade-ui-source.zip > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: arcade-ui-source
          path: |
            dist/arcade-ui-source.zip
            dist/SHA256SUMS

  release:
    name: GitHub release
    needs: [compiler, source-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arcade-ui-source
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: arcuxi-example
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/arcade-ui-source.zip dist/SHA256SUMS dist/dashboard.arcuxi \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
