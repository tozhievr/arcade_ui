name: C++ Formatting

on:
  push:
    branches: [master, 'ci/**', 'feature/**']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/clang-format-all.py'
      - '.clang-format'
      - '.github/workflows/format.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply clang-format changes and commit to the selected branch'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check:
    name: clang-format / check
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.apply }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install clang-format 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg ca-certificates
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install -y clang-format-21
      - name: Validate changed C++ files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="HEAD^"
          fi
          python3 tools/clang-format-all.py --check --changed-from "${BASE_SHA}" --binary clang-format-21
      - name: Full repository format report (existing style debt)
        continue-on-error: true
        run: python3 tools/clang-format-all.py --check --binary clang-format-21

  autofix:
    name: clang-format / apply
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Install clang-format 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg ca-certificates
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install -y clang-format-21
      - name: Format source and tests
        run: python3 tools/clang-format-all.py --fix --binary clang-format-21
      - name: Commit only formatting changes
        shell: bash
        run: |
          set -euo pipefail
          git add -- src tests
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply clang-format 21"
          git push origin "HEAD:${GITHUB_REF_NAME}"
